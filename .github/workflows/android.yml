name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      # Log artifact downloads are unreachable from the dev sandbox, so build
      # output is mirrored into the job summary, which the API does expose.
      - name: Compile
        id: compile
        run: |
          set -o pipefail
          ./gradlew assembleDebug testDebugUnitTest --stacktrace 2>&1 | tee /tmp/build.log
        continue-on-error: true

      - name: Surface build output
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Gradle result: ${{ steps.compile.outcome }}"
            echo '```'
            grep -E "^e: |^w: |error:|FAILURE|What went wrong|^\s+> " /tmp/build.log \
              | head -120 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Log artifacts and blob storage are unreachable from the dev
          # sandbox; a commit comment is served by api.github.com, which is not.
          if [ "${{ steps.compile.outcome }}" != "success" ]; then
            {
              echo "Gradle failed on \`${GITHUB_SHA:0:7}\`"
              echo
              echo '```'
              grep -E "^e: |error:|Caused by|Execution failed|FAILURE|What went wrong|^\s+> |Test.*FAILED|tests? (completed|failed)" \
                /tmp/build.log | head -60 || true
              echo "--- tail ---"
              tail -120 /tmp/build.log
              echo '```'
            } > /tmp/comment.md
            gh api "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
              -F body=@/tmp/comment.md >/dev/null || true

            # Annotations are readable via the check-runs API even when log
            # artifacts are not, so fold the errors into one.
            ERRS=$(grep -E "^e: |error:|What went wrong|^\s+> " /tmp/build.log \
                   | head -40 | sed 's/%/%25/g; s/\r/ /g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle failure::${ERRS}"
          fi
          [ "${{ steps.compile.outcome }}" = "success" ]

      - name: Report APK size
        if: success()
        run: |
          echo "### APK built :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh app/build/outputs/apk/debug/*.apk >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vdub-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
