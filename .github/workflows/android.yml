name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      # Log artifact downloads are unreachable from the dev sandbox, so build
      # output is mirrored into the job summary, which the API does expose.
      - name: Compile
        id: compile
        run: |
          set -o pipefail
          ./gradlew assembleDebug testDebugUnitTest --stacktrace 2>&1 | tee /tmp/build.log
        continue-on-error: true

      - name: Surface build output
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Gradle result: ${{ steps.compile.outcome }}"
            echo '```'
            grep -E "^e: |^w: |error:|FAILURE|What went wrong|^\s+> " /tmp/build.log \
              | head -120 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Log artifacts and blob storage are unreachable from the dev
          # sandbox; a commit comment is served by api.github.com, which is not.
          if [ "${{ steps.compile.outcome }}" != "success" ]; then
            {
              echo "Gradle failed on \`${GITHUB_SHA:0:7}\`"
              echo
              echo '```'
              grep -E "^e: |error:|Caused by|Execution failed|FAILURE|What went wrong|^\s+> |Test.*FAILED|tests? (completed|failed)" \
                /tmp/build.log | head -60 || true
              echo "--- tail ---"
              tail -120 /tmp/build.log
              echo '```'
            } > /tmp/comment.md
            gh api "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
              -F body=@/tmp/comment.md >/dev/null || true

            # Annotations are readable via the check-runs API even when log
            # artifacts are not, so fold the errors into one.
            ERRS=$(grep -E "^e: |error:|What went wrong|^\s+> " /tmp/build.log \
                   | head -40 | sed 's/%/%25/g; s/\r/ /g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle failure::${ERRS}"
          fi
          [ "${{ steps.compile.outcome }}" = "success" ]

      - name: Report APK size
        if: success()
        run: |
          echo "### APK built :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh app/build/outputs/apk/debug/*.apk >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vdub-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Actions artifacts require a logged-in GitHub session and expire; a
      # release asset can be downloaded straight onto a phone.
      - name: Publish rolling debug release
        if: success() && github.ref_name == 'arena/01a032f2-vdub'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk vdub-step1-debug.apk
          gh release delete step1-latest --yes --cleanup-tag || true
          gh release create step1-latest vdub-step1-debug.apk \
            --target "${GITHUB_SHA}" \
            --title "vdub Step 1 — debug APK" \
            --notes "Debug build of Step 1 (video upload, player, subtitles, trim).

          Commit: \`${GITHUB_SHA:0:7}\`

          Install: download the APK on your phone and allow install from unknown
          sources. On first run, grant **All files access** via the folder icon —
          the pipeline reads and writes /storage/emulated/0/AI/ directly."

      # Runs the app on a real Android image. Unit tests cannot cover
      # MediaCodec, MediaMuxer or ONNX Runtime, which is where every on-device
      # failure so far has come from.
      - name: Enable KVM
        if: success()
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Free space first: the emulator image plus the build outputs routinely
      # exhaust a runner's disk, and it surfaces as an unexplained boot failure.
      - name: Free disk space
        if: success()
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
                      /opt/ghc /usr/local/share/boost || true
          df -h / | tail -1

      # Set up the emulator by hand rather than via the action: its failures
      # arrive as a bare "exit code 2", and this workspace cannot read Actions
      # logs, so each stage has to report for itself.
      # No continue-on-error: a green run must mean the emulator stage ran.
      # The step previously carried continue-on-error and was reported as
      # success for two weeks while dying at AVD creation — the job badge
      # read "instrumented passed" on runs that never booted an emulator.
      - name: Instrumented tests
        if: success()
        id: instrumented
        timeout-minutes: 35
        run: |
          set -x
          LOG="$GITHUB_WORKSPACE/instr.log"
          exec > >(tee -a "$LOG") 2>&1

          echo "== sdk =="
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

          echo "== install image =="
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "system-images;android-30;default;x86_64" "platform-tools" "emulator" \
            | grep -v "Unzipping\|^\[=" || true

          echo "== create avd =="
          # avdmanager asks two things, in order:
          #   1. "Do you wish to create a custom hardware profile?"  -> yes/no
          #   2. "Please choose one of the following devices: 1. …"  -> a number
          # Each answer is consumed line by line, and a prompt answered with
          # the wrong kind of value is fatal ("no is not a valid reply"),
          # while a prompt left at EOF is a *silent* exit 0 with no AVD —
          # which is how every earlier attempt died. So feed the exact
          # sequence: "no" to the profile question, "1" (the first, always
          # valid, device) to the menu. Any trailing lines are ignored once
          # the AVD exists.
          printf 'no\n1\n' | "$SDK/cmdline-tools/latest/bin/avdmanager" create avd \
            -n ci -k "system-images;android-30;default;x86_64" --force || {
              echo "avdmanager exited $?"
              ls -la "$HOME/.android/avd" 2>&1 || true
              exit 1
            }
          "$SDK/emulator/emulator" -list-avds
          "$SDK/emulator/emulator" -list-avds | grep -qx ci \
            || { echo "AVD 'ci' was not created"; exit 1; }
          # The default profile's 1.5 GB RAM leaves little headroom for the
          # DhVaani smoke test's ~600 MB working set plus ORT.
          "$SDK/cmdline-tools/latest/bin/avdmanager" update avd \
            -n ci --force --set hw.ramSize=2048

          echo "== boot =="
          "$SDK/emulator/emulator" -avd ci -no-window -gpu swiftshader_indirect \
            -noaudio -no-boot-anim -no-snapshot -camera-back none &
          "$SDK/platform-tools/adb" wait-for-device
          # wait-for-device returns at the daemon, not at a usable system
          timeout 600 "$SDK/platform-tools/adb" shell \
            'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done'
          "$SDK/platform-tools/adb" devices

          echo "== test =="
          ./gradlew connectedDebugAndroidTest --stacktrace
          TESTS=$?

          # The DhVaani smoke test leaves the line it spoke on the emulator.
          # Pull it while the emulator is still up — background processes die
          # with this step — so a human can listen to what the on-device ORT
          # actually produced. Probes proved the graphs on x86 Linux; this is
          # the phone stack speaking for itself.
          echo "== pull smoke audio =="
          mkdir -p "$GITHUB_WORKSPACE/smoke"
          FOUND=$("$SDK/platform-tools/adb" shell \
              "find /storage/emulated/0/Android/data/com.azim.vdub /storage/emulated/0/AI \
               -name dhvaani_smoke_line.wav 2>/dev/null" \
            | tr -d '\r' | head -1)
          if [ -n "$FOUND" ]; then
            "$SDK/platform-tools/adb" pull "$FOUND" \
              "$GITHUB_WORKSPACE/smoke/dhvaani_smoke_line.wav"
            {
              echo "## DhVaani smoke audio (from the emulator)"
              echo '```'
              ls -lh "$GITHUB_WORKSPACE/smoke/dhvaani_smoke_line.wav"
              echo '```'
              echo "Pulled from \`$FOUND\`. Download the **dhvaani-smoke-audio**"
              echo "artifact and listen — it is one line spoken by the phone stack."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "(no smoke audio found — the test may not have run)" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $TESTS

      - name: Report instrumented result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUTCOME="${{ steps.instrumented.outcome }}"
          echo "## Instrumented tests: $OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "skipped" ]; then
            {
              echo "Instrumented tests failed on \`${GITHUB_SHA:0:7}\`"
              echo
              echo '```'
              python3 .github/scripts/report_instrumented.py 2>&1 | head -120
              echo
              echo "--- last 80 log lines ---"
              tail -80 "$GITHUB_WORKSPACE/instr.log" 2>/dev/null \
                || echo "(no log at all: the step died before writing one)"
              echo '```'
            } > /tmp/instr.md
            gh api "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
              -F body=@/tmp/instr.md >/dev/null || true
          fi

      # Always, not only on failure: a green run is exactly when the smoke
      # audio is most worth listening to.
      - name: Upload smoke audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dhvaani-smoke-audio
          path: smoke/dhvaani_smoke_line.wav
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
