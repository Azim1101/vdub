name: TTS probe

# Diagnostic only. The dev sandbox cannot reach huggingface.co, so the exact
# ONNX input/output signatures of a new engine have to be read somewhere that
# can. Guessing them means the app fails on a phone, hours into a download.
#
# Reports through the job summary and a commit comment, because Actions log
# artifacts are not reachable from the sandbox either.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tts-probe.yml'
      - 'tools/probe_tts.py'
      - 'tools/probe_tts2.py'

# Without this the token is read-only and the commit comment — the only
# channel out of here the sandbox can actually read — is silently dropped.
permissions:
  contents: write
  checks: write

jobs:
  probe:
    name: Read model signatures
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime
        run: pip install -q onnxruntime numpy onnx transformers

      - name: Probe
        id: probe
        continue-on-error: true
        timeout-minutes: 45
        run: |
          set -o pipefail
          : > /tmp/probe.log
          for s in ${PROBES:-tools/probe_tts2.py}; do
            echo "######## $s ########" | tee -a /tmp/probe.log
            python "$s" 2>&1 | tee -a /tmp/probe.log
          done

      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## TTS probe: ${{ steps.probe.outcome }}"
            echo '```'
            cat /tmp/probe.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "TTS probe on \`${GITHUB_SHA:0:7}\` — ${{ steps.probe.outcome }}"
            echo
            echo '```'
            tail -c 60000 /tmp/probe.log
            echo '```'
          } > /tmp/comment.md
          gh api "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -F body=@/tmp/comment.md || echo "comment failed"

          # Second channel: log artifacts live in blob storage the sandbox
          # cannot reach, but a release asset is served by api.github.com.
          gh release delete probe-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create probe-latest /tmp/probe.log \
            --target "${GITHUB_SHA}" \
            --title "TTS probe output" \
            --notes "Signatures read on ${GITHUB_SHA:0:7}." || echo "release failed"
